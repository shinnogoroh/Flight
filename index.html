$("orig").onclick=e=>{const c=e.target.dataset.c;if(!c)return;sel.has(c)?sel.size>1&&sel.delete(c):sel.add(c);e.target.classList.toggle("on",sel.has(c));run()};
for(const id of["trip","view"])$(id).onclick=e=>{const v=e.target.dataset.v;if(!v)return;[...$(id).children].forEach(b=>b.classList.toggle("on",b===e.target));id=="trip"?trip=v:view=v;run()};
document.querySelectorAll("input,select").forEach(e=>e.oninput=run);
function calc(){
 const m=$("mode").value,mix=$("mix").checked,mh=+$("dur").value,ms=+$("stops").value,px=+$("pax").value,cl=+$("cls").value,mo=new Date($("d1").value).getMonth()||0,ow=trip=="ow"?.55:1,out=[];
 for(const c of D){const row={c,per:{},best:null};
  for(const o of O.filter(o=>sel.has(o[0]))){const d=km(o[3],o[4],c[3],c[4]),h=hv(c[0]),hh=hv(c[0]+o[0]);
   const n=.88+(h%25)/100,no=.96+(hh%9)/100,fs=(h%2&&d>6000&&d<9000)?1:d<6000?0:1;
   const base=(15000+d*13)*n*no*o[2]*SEA[isNaN(mo)?9:mo]*ow*px*cl,fst=d<6000?0:d<9000?(h%2):d<14000?1:2;
   const opts=[{t:"FSC",p:base,s:fst,a:FS[(h+hv(o[0]))%FS.length]}];
   if(d<11500&&cl==1)opts.push({t:"LCC",p:base*.58,s:Math.min(2,fst+(d>3500?1:0)),a:LC[h%(d<4500?6:2)+(d>=4500?[2,6][h%2]-h%2*0:0)]||"Scoot"});
   if(mix&&m=="both"&&d>2500&&cl==1){let bh=null,bd=1e9;for(const H of HUB){const t=km(o[3],o[4],H[1],H[2])+km(H[1],H[2],c[3],c[4]);if(H[0]!=c[0]&&t<bd){bd=t;bh=H}}if(bh&&bd<d*1.35)opts.push({t:"MIX",p:base*.76,s:Math.max(1,fst),a:LC[(h+1)%6]+"→"+FS[(h+3)%FS.length],hub:bh[0],sep:1,dd:bd})}
for(const x of opts){if(m=="fsc"&&x.t!="FSC"||m=="lcc"&&x.t!="LCC"||x.s>ms)continue;x.o=o[0];x.h=(x.dd||d)/800+.7+x.s*2.5;if((mh<40&&x.h>mh)||x.a.split("→").some(a=>ex.has(a)))continue;
    if(!(o[0] in row.per)||x.p<row.per[o[0]].p)row.per[o[0]]=x;if(!row.best||x.p<row.best.p)row.best=x}}
  if(row.best)out.push(row)}
 return out}
function bands(rows){const ps=rows.map(r=>r.best.p).sort((a,b)=>a-b);
 if($("cm").value=="fix")return FIX;if(!ps.length)return FIX;return[.2,.4,.6,.8].map(q=>ps[Math.min(ps.length-1,Math.floor(q*ps.length))])}
const cls=(p,b)=>{let i=0;while(i<4&&p>b[i])i++;return i},yn=n=>"¥"+(Math.round(n/100)*100).toLocaleString();
function run(){
 const bud=$("bud").value*1e4;$("bv").textContent=yn(bud);$("dv").textContent=$("dur").value>=40?"制限なし":$("dur").value+"時間";
 const rows=calc().filter(r=>!$("hide").checked||r.best.p<=bud),b=bands(rows),ps=rows.map(r=>r.best.p).sort((a,z)=>a-z),lim=map.getZoom()>=4?1e12:(ps[24]||1e12);lay.clearLayers();
 $("legend").innerHTML="<b>価格凡例</b><br>"+COL.map((c,i)=>`<i style="background:${c}"></i>${NAME[i]} ${i==0?"〜"+yn(b[0]):i==4?yn(b[3])+"〜":yn(b[i-1])+"〜"+yn(b[i])}`).join("<br>")+"<br><span style='opacity:.7'>グレー＝予算超過</span>";
 const sort=$("sort").value;rows.sort((a,z)=>sort=="t"?a.best.h-z.best.h:sort=="s"?a.best.s-z.best.s||a.best.p-z.best.p:a.best.p-z.best.p);
 for(const r of rows){const x=r.best,c=r.c,over=x.p>bud,col=COL[cls(x.p,b)];
  const pop=`<b>${c[1]}</b> (${c[0]}) ${c[2]}<br>${[...Object.values(r.per)].sort((a,z)=>a.p-z.p).map(v=>`${v.o}発: ${yn(v.p)} ${v.a}(${v.t}) 乗継${v.s}${v.hub?"("+v.hub+")":""}${v.sep?"<br><small style='color:#c92a2a'>⚠別切り："+v.hub+"で乗継。乗継失敗時の保護なし／預け荷物の受取・再チェックイン／入国要件に注意</small>":""}`).join("<br>")}<br><small>※サンプル価格</small>`;
  if(view=="h"){const cc=L.circle([c[3],c[4]],{radius:1.1e6,stroke:false,fillColor:col,fillOpacity:over?.08:.3,interactive:false}).addTo(lay)}
  const m=L.marker([c[3],c[4]],{icon:L.divIcon({className:"",html:(view=="h"||over||x.p>lim)?`<div class="pd ${over?"gray":""}" style="--c:${over?"#888":col}"></div>`:`<div class="pm" style="--c:${col}">${map.getZoom()>=4?`<small>${c[1]}・${c[2]}</small>`:""}<b>${map.getZoom()>=4?yn(x.p):"¥"+Math.round(x.p/1000)+"k"}</b></div>`,iconSize:[0,0],iconAnchor:[0,0]}),zIndexOffset:-Math.round(x.p/1000)}).bindPopup(pop).addTo(lay);mk[c[0]]=m}
 $("rows").innerHTML=rows.map(r=>{const x=r.best,c=r.c,rem=bud-x.p;return`<tr class="r" data-c="${c[0]}"><td>${c[1]}</td><td>${c[2]}</td><td>${c[0]}</td><td>${x.o}</td><td>${x.a}${x.sep?" <small>別切り</small>":""}</td><td><span class="t ${x.t.toLowerCase()}">${x.t}</span></td><td><b>${yn(x.p)}</b> <small>サンプル</small></td><td style="color:${rem<0?"#d6402e":"#1b7f3b"}">${rem<0?"−":""}${yn(Math.abs(rem))}</td><td>${x.h.toFixed(1)}h</td><td>${x.s?x.s+"回"+(x.hub?"("+x.hub+")":""):"直行"}</td></tr>`}).join("")||"<tr><td colspan=10>条件に合う目的地がありません</td></tr>"}
$("rows").onclick=e=>{const t=e.target.closest("tr.r");if(!t)return;const m=mk[t.dataset.c],id=t.dataset.c;map.once("moveend",()=>mk[id]&&mk[id].openPopup());map.flyTo(m.getLatLng(),5);$("map").scrollIntoView({behavior:"smooth"})};
run();
let zb=map.getZoom()>=4;map.on("zoomend",()=>{const n=map.getZoom()>=4;if(n!==zb){zb=n;run()}});
</script></body></html>
